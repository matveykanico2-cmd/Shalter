  <script>
    // Тема до первой отрисовки: настройки приходят с сервера позже, и до них
    // мелькала светлая тема. Последнюю выбранную помним в localStorage.
    (function () {
      var root = document.documentElement;
      try {
        var savedTheme = localStorage.getItem("shalter.theme");
        if (savedTheme === "dark") root.setAttribute("data-theme", "dark");
        else if (savedTheme === "light") root.setAttribute("data-theme", "light");
        else {
          try {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              root.setAttribute("data-theme", "dark");
            }
          } catch (e) {}
        }
      } catch (e) {}
      try {
        var savedAccent = localStorage.getItem("shalter.accent");
        if (savedAccent) root.style.setProperty("--color-accent", savedAccent);
      } catch (e) {}
      try {
        var savedFont = localStorage.getItem("shalter.fontSize");
        if (savedFont) {
          var n = parseInt(savedFont, 10);
          if (n && n !== 16) root.style.setProperty("--messages-text", n + "px");
        }
      } catch (e) {}
      try {
        var iconSvg = localStorage.getItem("shalter.appIcon.splash");
        var splashEl = document.getElementById("boot-splash");
        if (iconSvg && splashEl) {
          var holder = document.createElement("div");
          holder.innerHTML = iconSvg;
          var svgEl = holder.querySelector("svg");
          var oldSvg = splashEl.querySelector("svg.bs-logo-svg");
          if (svgEl && oldSvg) {
            svgEl.classList.add("bs-logo-svg");
            oldSvg.replaceWith(svgEl);
          }
        }
      } catch (e) {}
      new MutationObserver(function () {
        try {
          var t = root.getAttribute("data-theme");
          if (t) localStorage.setItem("shalter.theme", t);
          else localStorage.removeItem("shalter.theme");
        } catch (e) {}
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    })();
  
  </script>

  <style>
    /* Заставка Shalter: пузырьки сообщений слетаются в щит (shelter — укрытие), он
       прорисовывается контуром и заливается, внутри «печатают» три точки, пока грузимся.
       Только transform/opacity и stroke-dashoffset — без перерисовки на слабых телефонах. */
    #boot-splash {
      --bs-bg: #3d6df0;
      --bs-fg: #ffffff;
      --bs-soft: rgba(255, 255, 255, 0.22);
      --bs-dot: #3d6df0;
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bs-bg);
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #boot-splash { --bs-bg: #0f0f12; --bs-fg: #8774e1; --bs-soft: rgba(135, 116, 225, 0.25); --bs-dot: #ffffff; }
    }
    :root[data-theme="dark"] #boot-splash { --bs-bg: #0f0f12; --bs-fg: #8774e1; --bs-soft: rgba(135, 116, 225, 0.25); --bs-dot: #ffffff; }
    #boot-splash .bs-logo { position: relative; display: flex; align-items: center; justify-content: center; }
    #boot-splash svg.bs-logo-svg { width: 96px; height: 96px; overflow: visible; }
    #boot-splash .bs-bubble { fill: var(--bs-fg); transform-box: fill-box; transform-origin: center; animation: bs-gather 0.7s cubic-bezier(0.5, 0, 0.3, 1) both; }
    #boot-splash .bs-bubble:nth-child(2) { animation-delay: 0.06s; }
    #boot-splash .bs-bubble:nth-child(3) { animation-delay: 0.12s; }
    #boot-splash .bs-bubble:nth-child(4) { animation-delay: 0.18s; }
    #boot-splash .bs-bubble:nth-child(5) { animation-delay: 0.24s; }
    #boot-splash .bs-halo { fill: var(--bs-soft); transform-box: fill-box; transform-origin: center; animation: bs-halo 2s ease-out 0.9s infinite; opacity: 0; }
    #boot-splash .bs-shield-line { fill: none; stroke: var(--bs-fg); stroke-width: 5; stroke-linejoin: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: bs-draw 0.6s ease-out 0.45s forwards; }
    #boot-splash .bs-shield-fill { fill: var(--bs-fg); opacity: 0; transform-box: fill-box; transform-origin: center; animation: bs-fill 0.35s ease-out 0.9s forwards; }
    #boot-splash .bs-dot { fill: var(--bs-dot); opacity: 0; transform-box: fill-box; transform-origin: center; animation: bs-type 1.2s ease-in-out 1.1s infinite; }
    #boot-splash .bs-dot:nth-of-type(2) { animation-delay: 1.25s; }
    #boot-splash .bs-dot:nth-of-type(3) { animation-delay: 1.4s; }
    /* «Shalter»: буквы встают в строку, а когда приложение загрузилось — разлетаются (скрипт ниже) */
    #boot-splash .bs-word {
      position: relative;
      display: flex;
      gap: 1px;
      font: 700 34px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.01em;
      color: var(--bs-fg);
      transform: translateZ(0);
    }
    #boot-splash .bs-word i {
      display: inline-block;
      font-style: normal;
      opacity: 0;
      transform: translateY(18px) scale(0.7);
      transition: opacity 0.4s cubic-bezier(0.2, 0, 0.2, 1), transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform, opacity;
    }
    #boot-splash.bs-leave svg.bs-logo-svg { transition: transform 0.4s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.4s; transform: scale(1.6); opacity: 0; }
    @keyframes bs-gather {
      0% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(0.4); }
      60% { opacity: 1; }
      100% { opacity: 0; transform: translate(0, 0) scale(0.2); }
    }
    @keyframes bs-draw { to { stroke-dashoffset: 0; } }
    @keyframes bs-fill { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
    @keyframes bs-halo { 0% { opacity: 0.9; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.35); } }
    @keyframes bs-type { 0%, 100% { opacity: 0.45; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-5px); } 60% { opacity: 0.45; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .bs-bubble, #boot-splash .bs-halo { display: none; }
      #boot-splash .bs-shield-line, #boot-splash .bs-shield-fill, #boot-splash .bs-dot { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>

  <script>
    // Lightweight boot splash - CSS-driven animation, no heavy JS math
    (function () {
      var word = document.querySelector("#boot-splash .bs-word");
      if (!word) return;
      var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var letters = "Shalter".split("").map(function (ch, i) {
        var el = document.createElement("i");
        el.textContent = ch;
        el.style.transitionDelay = (0.45 + i * 0.05) + "s";
        word.appendChild(el);
        return el;
      });
      var start = Date.now();
      if (reduced) {
        letters.forEach(function (el) { el.style.opacity = "1"; el.style.transform = "none"; });
        window.__splashExit = function (done) { done && done(); };
        return;
      }
      // Trigger animation
      requestAnimationFrame(function() {
        letters.forEach(function (el) {
          el.style.opacity = "1";
          el.style.transform = "none";
        });
      });
      window.__splashStart = start;
      window.__splashExit = function (done) {
        var sp = document.getElementById("boot-splash");
        if (sp) sp.classList.add("bs-leave");
        letters.forEach(function (el, i) {
          el.style.transitionDelay = (i * 0.03) + "s";
          el.style.opacity = "0";
          el.style.transform = "translateY(-18px) scale(0.7)";
        });
        setTimeout(done, 500);
      };
    })();
  </script>
  <script>
    // Выбранная иконка приложения (lib/appIcons.js) — на заставке и во вкладке сразу,
    // ещё до загрузки модулей.
    try {
      var iconSvg = localStorage.getItem("shalter.appIcon.splash");
      var splashEl = document.getElementById("boot-splash");
      if (iconSvg && splashEl) {
        var holder = document.createElement("div");
        holder.innerHTML = iconSvg;
        var svgEl = holder.querySelector("svg");
        var oldSvg = splashEl.querySelector("svg.bs-logo-svg");
        if (svgEl && oldSvg) {
          svgEl.setAttribute("aria-hidden", "true");
          svgEl.classList.add("bs-logo-svg");
          if (oldSvg.parentNode) oldSvg.parentNode.replaceChild(svgEl, oldSvg);
        }
      }
    } catch (e) {}
    // Приложение убирает заставку после первой отрисовки экрана (app/model/boot-splash.ts);
    // на случай сбоя (модуль не догрузился на плохой сети) — не дольше 3 с.
    function killSplash() {
      try {
        var s = document.getElementById("boot-splash");
        if (s) s.remove();
      } catch (e) {}
    }
    setTimeout(killSplash, 3000);
    // Необработанная ошибка при загрузке не должна оставить пользователя под заставкой.
    window.addEventListener("error", killSplash);
    window.addEventListener("unhandledrejection", killSplash);
  </script>
