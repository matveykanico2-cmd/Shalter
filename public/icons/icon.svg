<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Знак Shalter. Геометрия снята с исходной картинки по точкам: круг, белое
       облачко с уходящей вправо-вверх кромкой, отогнутое светлое «крыло» справа
       и хвостик облачка слева внизу. -->
  <circle cx="256" cy="256" r="256" fill="#3d6df0"/>
  <!-- Тело облачка -->
  <path fill="#ffffff" d="M65 186L397 131L357 333L77 336Z"/>
  <!-- Отогнутое крыло: от острия вправо вниз -->
  <path fill="#a9c4fb" d="M397 131L250 235L357 333Z"/>
  <!-- Хвостик облачка -->
  <path fill="#d3e0fd" d="M134 336L214 340L138 437Z"/>
</svg>
