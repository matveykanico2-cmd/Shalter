  <!-- Заставка на запуск — своими стилями, не из components.css: тот файл
       сейчас 250+ КБ, и ждать его ради экрана, который и существует только
       чтобы прикрыть это ожидание, было бы бессмысленно. Живёт вне #view-root
       и убирается из app.js, когда есть что показать взамен — экран входа,
       код доступа или сам список чатов (см. removeSplash в app.js). -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--color-bg, #f5f6f9);
      transition: opacity 0.25s ease;
    }
    #boot-splash svg { width: 72px; height: 72px; }
    #boot-splash span {
      font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--color-muted, #8a8f98);
      letter-spacing: 0.02em;
    }
    #boot-splash.boot-splash-hidden { opacity: 0; pointer-events: none; }
  </style>

<!-- Запросы стартуют здесь, а не в app.js.
     На плохой связи браузер сначала полторы секунды качает и разбирает код и
     только потом спрашивает сервер, кто вошёл и какие есть чаты. Отсюда оба
     запроса уходят сразу — они едут одновременно со скачиванием кода, а
     приложение потом просто забирает готовые обещания (см. js/api.js). -->
<script>
  // На странице входа спрашивать нечего: сессии ещё нет, и запрос вернул бы
  // отказ — лишняя поездка и красная строка в консоли на ровном месте.
  if (!/^\/(login|qr-login)/.test(location.pathname)) {
    window.__boot = {
      session: fetch("/api/auth/session", { credentials: "include" }).then((r) => r.json()).catch(() => null),
      data: fetch("/api/bootstrap", { credentials: "include" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    };
  }
</script>

<body>
  <div id="boot-splash">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <circle cx="256" cy="256" r="256" fill="#3d6df0"/>
      <path fill="#ffffff" d="M65 186L397 131L357 333L77 336Z"/>

    <span>by Matvey</span>
  </div>
  <script>
    // Строго подстраховка: если app.js по какой-то причине не подхватит
    // заставку сам (не догрузился, упал ещё до своего кода — см. app.js's
    // removeSplash), она не должна закрывать экран вечно.
    setTimeout(function () {
      var s = document.getElementById("boot-splash");
      if (s) s.remove();
    }, 10000);
  </script>
