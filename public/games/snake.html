<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#1b2b1e;color:#e8f5e9;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
canvas{background:#24402a;border-radius:12px;width:min(92vw,70vh);height:min(92vw,70vh)}
.hud{font-size:18px;font-weight:700}.msg{font-size:14px;opacity:.8}</style></head><body><div class="wrap">
<div class="hud">🍎 <span id="s">0</span> · рекорд <span id="b">0</span></div><canvas id="c" width="400" height="400"></canvas><div class="msg" id="m">Нажмите или свайпните, чтобы начать</div></div>
<script>
const N=20,S=20,c=document.getElementById("c"),x=c.getContext("2d");let snake,dir,next,food,score,best=+localStorage.getItem("bsnake")||0,timer=null,alive=false;
document.getElementById("b").textContent=best;
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function start(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=next={x:1,y:0};score=0;place();alive=true;document.getElementById("m").textContent="";clearInterval(timer);timer=setInterval(step,110);upd()}
function upd(){document.getElementById("s").textContent=score;Shalter.score(score)}
function step(){dir=next;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
if(snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);if(score>best){best=score;localStorage.setItem("bsnake",best);document.getElementById("b").textContent=best}document.getElementById("m").textContent="Игра окончена — нажмите, чтобы сыграть снова";Shalter.gameOver(score);return}
snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;upd();place()}else snake.pop();draw()}
function draw(){x.fillStyle="#24402a";x.fillRect(0,0,400,400);x.fillStyle="#ff5252";x.beginPath();x.arc(food.x*S+10,food.y*S+10,8,0,7);x.fill();
snake.forEach((p,i)=>{x.fillStyle=i?"#66bb6a":"#a5d6a7";x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)})}
function turn(d){if(!alive)return start();if(d.x!==-dir.x||d.y!==-dir.y)next=d}
addEventListener("keydown",e=>{const m={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}}[e.key];if(m){e.preventDefault();turn(m)}else if(e.key===" "&&!alive)start()});
let sx,sy;addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});addEventListener("pointerup",e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!alive)start();return}turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})});
snake=[{x:9,y:10}];food={x:14,y:10};draw();
</script></body></html>
