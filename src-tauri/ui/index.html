<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shalter</title>
  <style>
    :root { --bg: #f5f6f9; --text: #1c1d21; --muted: #707579; --accent: #3390ec; }
    @media (prefers-color-scheme: dark) { :root { --bg: #181a1f; --text: #f1f1f1; --muted: #aaaaaa; --accent: #8774e1; } }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 20px; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 20px; color: var(--muted); }
    button { padding: 10px 22px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Стартовая страница оболочки: проверяет, что сервер отвечает, и переходит на
       него. Без связи — экран ожидания с автоповтором (как offline.html в Electron). -->
  <main>
    <div class="spinner" role="status" aria-label="Подключение"></div>
    <div id="offline" hidden>
      <h1>Ожидание сети…</h1>
      <p>Shalter не может связаться с сервером. Как только связь появится, приложение откроется само.</p>
      <button id="retry" type="button">Повторить сейчас</button>
    </div>
  </main>
  <script>
    const RETRY_MS = 5000;
    const TIMEOUT_MS = 8000;
    let target = null;
    let timer = null;

    async function reachable(url) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      try {
        await fetch(new URL("/manifest.webmanifest", url), { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(t);
      }
    }

    async function attempt() {
      clearTimeout(timer);
      if (await reachable(target)) {
        location.replace(target);
        return;
      }
      document.getElementById("offline").hidden = false;
      timer = setTimeout(attempt, RETRY_MS);
    }

    document.getElementById("retry").addEventListener("click", attempt);
    window.addEventListener("online", attempt);

    window.__TAURI_INTERNALS__
      .invoke("startup_target")
      .then((url) => {
        target = url;
        attempt();
      });
  </script>
</body>
</html>
