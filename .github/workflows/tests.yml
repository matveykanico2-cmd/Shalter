name: Tests

# Тесты фиксируют текущее поведение перед миграцией на NestJS + React
# (см. packages/contract-tests/README.md). Контрактные тесты и тесты совместимости данных — на
# каждый PR; браузерные сценарии (Playwright) — на PR в main и пуш в main.
# Матрица TARGET: legacy — server/index.js, nest — каркас NestJS (apps/api), который
# отдаёт ещё не перенесённое старому приложению. Обе цели обязаны быть зелёными.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Контрактные, совместимость, unit (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, nest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:types
      - run: npm run build:api
        if: matrix.target == 'nest'
      - run: npm run test:contract
        env:
          TARGET: ${{ matrix.target }}

  e2e:
    name: Сценарии в браузере (${{ matrix.target }})
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, nest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:api
        if: matrix.target == 'nest'
      - run: npm run test:e2e
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.target }}
          path: |
            packages/contract-tests/e2e/.report/
            packages/contract-tests/e2e/.results/
          retention-days: 7
