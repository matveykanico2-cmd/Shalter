name: Build desktop apps

# Tauri собирает только под ту ОС (и архитектуру), на которой запущен, поэтому
# каждая платформа — своя машина в матрице. `npm run desktop:build` = `tauri build`
# + scripts/collect-desktop.js, который кладёт сборки в public/downloads под
# стабильными именами (Shalter.AppImage, Shalter-Windows-Setup.exe, …).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed to create/update the GitHub Release these artifacts get attached to
# below — the default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Mac на Intel собираем на том же macos-latest (Apple M) кросс-компиляцией:
        # машины macos-13 (Intel) GitHub выводит из работы — задача часами ждала раннера.
        include:
          - { os: ubuntu-22.04, name: ubuntu-22.04 }
          - { os: windows-latest, name: windows-latest }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-latest, name: macos-x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # Системный WebView (WebKitGTK) и трей для Linux-сборки.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # --ignore-scripts: иначе npm компилирует better-sqlite3 — базу данных *сервера*,
      # десктопной оболочке ненужную; на windows-latest для этого нет Visual Studio C++.
      # Tauri CLI и esbuild приходят готовыми бинарниками и без скриптов.
      - run: npm ci --ignore-scripts

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target "${{ matrix.target }}"
          else
            npx tauri build
          fi
          node scripts/collect-desktop.js
        env:
          TAURI_TARGET: ${{ matrix.target }}

      # Unsigned: macOS artifacts will hit Gatekeeper, Windows will hit
      # SmartScreen, on first launch — see DEPLOY_DESKTOP.md's "code signing"
      # notes for what removing those warnings actually requires.
      - uses: actions/upload-artifact@v4
        with:
          name: shalter-desktop-${{ matrix.name }}
          path: |
            public/downloads/Shalter.AppImage
            public/downloads/Shalter.deb
            public/downloads/Shalter-Windows-Setup.exe
            public/downloads/Shalter-macOS-*.zip
          if-no-files-found: ignore

      # A GitHub Release's assets are permanent, public, no-login URLs — what a
      # public "Скачать" page can link to. Only on an actual `v*` tag push.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/downloads/Shalter.AppImage
            public/downloads/Shalter.deb
            public/downloads/Shalter-Windows-Setup.exe
            public/downloads/Shalter-macOS-*.zip
          fail_on_unmatched_files: false
