name: Build Android APK

# ubuntu-latest GitHub Actions runners ship with a Java JDK and the Android
# SDK/build-tools preinstalled — the one thing the local dev machine this repo
# was built on doesn't have (see DEPLOY_MOBILE.md: "needs Android Studio...
# which this environment doesn't have"). That's the only reason this workflow
# can build an APK at all without any extra setup steps.
#
# По умолчанию (workflow_dispatch без галочки `release`, либо любой запуск
# без секретов подписи) собирается *debug*-APK — его можно просто side-loadить
# на телефон для тестов, но он не подходит в магазин.
#
# *Release* (подписанный APK/AAB для RuStore/Google Play) собирается, когда
# заданы четыре секрета ниже и выполнено одно из условий:
#   • нажата пометка `release` при ручном workflow_dispatch, либо
#   • пуш тега `v*` (автоматически — APK прикрепляется к GitHub Release).
#
# Секреты:
#   ANDROID_KEYSTORE_BASE64    файл .jks/.keystore в base64
#   ANDROID_KEYSTORE_PASSWORD  пароль keystore
#   ANDROID_KEY_ALIAS          алиас ключа внутри (у Shalter: shalter)
#   ANDROID_KEY_PASSWORD       пароль ключа (часто совпадает с keystore password)
#
# Ключ подписи не генерируется и не коммитится здесь — потеря ключа = потеря
# возможности обновлять уже опубликованное приложение, так что создайте его один
# раз (`keytool -genkeypair -v -keystore release.keystore -alias shalter
# -keyalg RSA -keysize 2048 -validity 10000` с JDK, или `openssl pkcs12` —
# оба формата читает AGP) и задайте секреты прежде, чать запускать релиз.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Подписать release APK/AAB (требует секреты подписи)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Needed to create/update the GitHub Release the signed APK gets attached to
# below — the default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7 собирается только на JDK 21; по умолчанию на раннере — 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run build

      # android/ is gitignored (see .gitignore's Capacitor comment) —
      # regenerated fresh every run, same as any other machine would.
      - run: npx cap add android
      - run: npx cap sync android
      # Иконки и заставки Shalter поверх стандартных от `cap add` (resources/).
      - run: node scripts/apply-native-resources.js android
        env:
          # Файл из Firebase (Настройки проекта → Android-приложение ru.shalter.app).
          # Можно и просто положить его в resources/android/google-services.json.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # esbuild (scripts/build.js) в public/dist кладёт предварительно сжатые
      # .gz/.br (для nginx) и .map — cap sync копирует их в assets/public/ рядом с
      # оригиналами, и AAPT падает с "Duplicate resources", сборка не проходит.
      # На устройстве WebView (file://) они не нужны — чистим перед упаковкой.
      - name: Strip precompressed web assets
        run: find android/app/src/main/assets/public -type f \( -name '*.gz' -o -name '*.br' -o -name '*.map' \) -delete

      # Постоянный ключ подписи debug-сборок. Без него каждый запуск генерировал
      # новый случайный ключ, и Android отказывался ставить новую версию поверх
      # старой («конфликт пакетов»). Ключ отладочный, не для магазина, — хранится в git.
      - name: Fixed debug signing key
        run: mkdir -p ~/.android && cp resources/android/debug.keystore ~/.android/debug.keystore

      - name: Check for release-signing secrets
        id: has_signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Release = есть секреты подписи И (тег v* ИЛИ ручной запуск с галочкой release).
      - name: Resolve build mode
        id: mode
        run: |
          RELEASE="false"
          if [ "${{ steps.has_signing.outputs.configured }}" = "true" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.release }}" = "true" ]; }; then
            RELEASE="true"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # ---------------- подписанный release ----------------
      - name: Decode keystore
        if: steps.mode.outputs.release == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write keystore.properties
        if: steps.mode.outputs.release == 'true'
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Patches android/app/build.gradle with a release signingConfig that
      # reads keystore.properties above — see scripts/ci-sign-android.js's
      # own header comment for why this has to happen here (in CI, post-cap-
      # add) rather than as a one-time edit to a committed file.
      - name: Wire up release signing
        if: steps.mode.outputs.release == 'true'
        run: node scripts/ci-sign-android.js

      - name: Assemble signed release APK
        if: steps.mode.outputs.release == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.release == 'true'
        with:
          name: shalter-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Google Play принимает новые приложения только в формате AAB (RuStore — и APK, и AAB).
      - name: Assemble signed release AAB
        if: steps.mode.outputs.release == 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.release == 'true'
        with:
          name: shalter-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Actions artifacts (above) need a GitHub login and expire через 90
      # дней — для public/download.html ссылка должна быть постоянной и без логина.
      # Только подписанный release APK стоит так выкладывать (debug‑сборка не
      # для магазина и не для download.html); переименованный в Shalter.apk.
      # Только при пуше тега v* с заданными секретами — никогда для простого
      # workflow_dispatch‑теста.
      - name: Rename for release
        if: steps.mode.outputs.release == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk Shalter.apk

      - name: Publish to GitHub Release
        if: steps.mode.outputs.release == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shalter.apk

      # ---------------- debug (тестирование / side-load) ----------------
      - name: Assemble debug APK
        if: steps.mode.outputs.release == 'false'
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.release == 'false'
        with:
          name: shalter-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
